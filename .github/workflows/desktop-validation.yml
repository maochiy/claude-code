name: Desktop validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop-validation.yml'
      - 'build.ts'
      - 'bun.lock'
      - 'package.json'
      - 'packages/**'
      - 'scripts/**'
      - 'src/**'
      - 'desktop/**'
  push:
    branches: [main, codex/desktop-local-rebuild]
    paths:
      - '.github/workflows/desktop-validation.yml'
      - 'build.ts'
      - 'bun.lock'
      - 'package.json'
      - 'packages/**'
      - 'scripts/**'
      - 'src/**'
      - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-runtime:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            platform: darwin
            arch: arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - name: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
    env:
      BUN_VERSION: 1.3.14
      CLAUDE_CODE_SKIP_CHROME_MCP_SETUP: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      USE_HARD_LINKS: 'false'
      VALIDATION_EVIDENCE: .desktop-validation/${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - name: 检出源码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装固定 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 校验原生宿主架构
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ARCH=$(bun -e 'process.stdout.write(process.arch)')
          test "${ACTUAL_ARCH}" = "${{ matrix.arch }}"
          test "$(bun --version)" = "${BUN_VERSION}"

      - name: 安装 CLI 根依赖
        run: bun install --frozen-lockfile

      - name: 安装 Desktop 独立依赖
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: 检查并构建 CLI
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck
          bun run lint
          bun run build
          bun run check:bundle

      # 回归失败仍收集目录包证据，最后显式令整个任务失败。
      - name: CLI 逐文件隔离回归
        id: cli-tests
        continue-on-error: true
        run: bun run test:isolated

      - name: 检查 Desktop 与 smoke BDD
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck
          bun test apps/electron/scripts/packaged-runtime-smoke.test.ts

      - name: 构建 Desktop
        run: bun run desktop:build

      - name: 生成 macOS 目录包
        if: runner.os == 'macOS'
        working-directory: desktop/apps/electron
        shell: bash
        run: |
          set -euo pipefail
          bunx electron-builder --mac --${{ matrix.arch }} --dir --publish never

      - name: 生成 Windows 目录包
        if: runner.os == 'Windows'
        working-directory: desktop/apps/electron
        shell: pwsh
        run: |
          bunx electron-builder --win --x64 --dir --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 运行包内 Runtime/CLI/Service/退出 smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${VALIDATION_EVIDENCE}"
          bun desktop/apps/electron/scripts/packaged-runtime-smoke.ts \
            --out-root desktop/apps/electron/out \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --evidence "${VALIDATION_EVIDENCE}/packaged-runtime-smoke.json"

      - name: 保留 CLI 回归失败结论
        if: always() && steps.cli-tests.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: 上传验证证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-validation-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ env.VALIDATION_EVIDENCE }}/
            desktop/apps/electron/out/builder-effective-config.yaml
            desktop/apps/electron/out/builder-debug.yml
          if-no-files-found: error
          retention-days: 14
